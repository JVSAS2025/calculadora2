<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Minibodega</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    .item { margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
    .item img { 
  width: 280px !important; 
  max-width: 100% !important; 
  height: auto; 
  display: block; 
  margin-top: 8px; 
}
    label { font-weight: bold; }
   input[type="number"] { width: 280px; max-width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 15px; font-size: 16px; }
    #box-3d, #recommendation { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Calculadora de área para Minibodegas</h1>

  <form id="calc-form">

    <div class="item">
      <label for="cajaPequena">Caja pequeña (0.2m x 0.3m x 0.4m)</label>
      <input type="number" id="cajaPequena" min="0" placeholder="Cantidad">
      <img src="cajapequeña.JPG" alt="Caja pequeña" width="300">
    </div>

    <div class="item">
      <label for="cajaGrande">Caja grande (0.4m x 0.5m x 0.6m)</label>
      <input type="number" id="cajaGrande" min="0" placeholder="Cantidad">
      <img src="cajagrande.JPG" alt="Caja grande">
    </div>

    <div class="item">
      <label for="sofa2">Sofá 2 puestos (0.9m x 1.5m x 0.8m)</label>
      <input type="number" id="sofa2" min="0" placeholder="Cantidad">
      <img src="sofa2puestos.JPG" alt="Sofá 2 puestos">
    </div>

    <div class="item">
      <label for="sofa3">Sofá 3 puestos (0.9m x 2.0m x 0.8m)</label>
      <input type="number" id="sofa3" min="0" placeholder="Cantidad">
      <img src="sofa3puestos.JPG" alt="Sofá 3 puestos">
    </div>

    <div class="item">
      <label for="camaSencilla">Cama sencilla (1.0m x 1.9m x 0.55m)</label>
      <input type="number" id="camaSencilla" min="0" placeholder="Cantidad">
      <img src="individual2.JPG" alt="Cama individual">
    </div>

    <div class="item">
      <label for="camaDoble">Cama doble Queen (1.5m x 1.9m x 0.55m)</label>
      <input type="number" id="camaDoble" min="0" placeholder="Cantidad">
      <img src="camadoble.JPG" alt="Cama doble Queen">
    </div>

        <div class="item">
      <label for="camaDobleKing">Cama doble king (2.0m x 2.0m x 0.65m)</label>
      <input type="number" id="camaDobleKing" min="0" placeholder="Cantidad">
      <img src="camadobleking.JPG" alt="Cama doble King">
    </div>
    <div class="item">
      <label for="tv48">TV 48" (0.63m x 0.12m x 1.08m)</label>
      <input type="number" id="tv48" min="0" placeholder="Cantidad">
      <img src="tv48.JPG" alt="TV 48"">
    </div>



    <div class="item">
      <label for="mesaGrande">Mesa grande (2.0m x 1.0m x 0.75m)</label>
      <input type="number" id="mesaGrande" min="0" placeholder="Cantidad">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Wooden_table.jpg/300px-Wooden_table.jpg" alt="Mesa grande">
    </div>

    <div class="item">
      <label for="mesaPequena">Mesa pequeña (1.0m x 0.5m x 0.75m)</label>
      <input type="number" id="mesaPequena" min="0" placeholder="Cantidad">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/Small_wood_table.jpg/280px-Small_wood_table.jpg" alt="Mesa pequeña">
    </div>

    <div class="item">
      <label for="sillaComedor">Silla de comedor (0.45m x 0.45m x 0.9m)</label>
      <input type="number" id="sillaComedor" min="0" placeholder="Cantidad">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Chair_wood.jpg/280px-Chair_wood.jpg" alt="Silla comedor">
    </div>

    <div class="item">
      <label for="neveraGrande">Nevera grande (1.8m x 0.7m x 0.7m)</label>
      <input type="number" id="neveraGrande" min="0" placeholder="Cantidad">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Modern_fridge.jpg/300px-Modern_fridge.jpg" alt="Nevera grande">
    </div>

    <div class="item">
      <label for="neveraPequena">Nevera pequeña (1.2m x 0.55m x 0.55m)</label>
      <input type="number" id="neveraPequena" min="0" placeholder="Cantidad">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/Compact_fridge.jpg/300px-Compact_fridge.jpg" alt="Nevera pequeña">
    </div>

    <button type="submit">Calcular</button>
  </form>

  <p id="box-3d"></p>
  <p id="recommendation"></p>

<script>
  document.getElementById("calc-form").addEventListener("submit", function (event) {
    event.preventDefault(); // Prevenir recarga

    const items = [
      { id: "cajaPequena", dimensiones: [0.2, 0.3, 0.4] },
      { id: "cajaGrande", dimensiones: [0.4, 0.5, 0.6] },
      { id: "sofa2", dimensiones: [0.9, 1.5, 0.8] },
      { id: "sofa3", dimensiones: [0.9, 2.0, 0.8] },
      { id: "camaSencilla", dimensiones: [1.0, 1.9, 0.55] },
      { id: "camaDoble", dimensiones: [1.5, 1.9, 0.55] },
      { id: "camaDobleKing", dimensiones: [2.0, 2.0, 0.65] },
      { id: "tv48", dimensiones: [0.63, 0.12, 1.08] },
      { id: "mesaGrande", dimensiones: [2.0, 1.0, 0.75] },
      { id: "mesaPequena", dimensiones: [1.0, 0.5, 0.75] },
      { id: "sillaComedor", dimensiones: [0.45, 0.45, 0.9] },
      { id: "neveraGrande", dimensiones: [1.8, 0.7, 0.7] },
      { id: "neveraPequena", dimensiones: [1.2, 0.55, 0.55] }
    ];

    let volumenTotal = 0;
    let areaTotal = 0;
    let alturaMinimaRecomendada = 0;

items.forEach(item => {
  const cantidad = parseInt(document.getElementById(item.id).value) || 0;
  const [a, b, c] = item.dimensiones;

  const volumen = a * b * c;
  const area = b * c;
  const altura = a;

  volumenTotal += cantidad * volumen;
  areaTotal += cantidad * area;

  if (cantidad > 0 && altura > alturaMinimaRecomendada) {
    alturaMinimaRecomendada = altura;
  }
});

    volumenTotal = Math.round(volumenTotal * 100) / 100;
    areaTotal = Math.round(areaTotal * 100) / 100;
    alturaMinimaRecomendada = Math.round(alturaMinimaRecomendada * 100) / 100;

    // Mostrar resultados
    document.getElementById("box-3d").textContent = `Volumen total estimado: ${volumenTotal} m³`;

    // Área recomendada y altura
    let mensaje = `Área mínima de bodega recomendada: ${areaTotal} m²`;
    if (alturaMinimaRecomendada > 0) {
      mensaje += ` | Altura mínima recomendada: ${alturaMinimaRecomendada} m`;
    }

    document.getElementById("recommendation").textContent = mensaje;
  });
</script>



</body>
</html>
